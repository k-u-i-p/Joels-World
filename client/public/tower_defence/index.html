<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minion Tower Defense</title>
    <meta name="description" content="A premium HTML5 Canvas Tower Defense Game">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-panel">
            <h1>Minion Defense</h1>
            
            <div id="apocalypse-container" class="hidden" style="text-align: center; color: #e74c3c; font-weight: bold; margin-bottom: 15px; font-size: 1.2rem; text-transform: uppercase;">
                <div style="text-shadow: 0 0 10px #e74c3c;">Time of the Apocalypse</div>
                <div id="apocalypse-time" style="font-size: 1.8rem; letter-spacing: 2px; font-family: monospace; text-shadow: 0 0 15px #e74c3c;">00:00:00</div>
            </div>
            
            <div class="stats">
                <div class="stat-box">
                    <span>Money:</span>
                    <span id="money-display">£50</span>
                </div>
                <div class="stat-box">
                    <span>Lives:</span>
                    <span id="lives-display">20</span>
                </div>
                <div class="stat-box">
                    <span>Wave:</span>
                    <span id="wave-display">1</span>
                </div>
            </div>
            
            <h2>Minions</h2>
            <div id="shop" class="shop-grid">
                <!-- Shop items will be generated by JS -->
            </div>
            
            <div id="upgrade-panel" class="hidden">
                <div class="panel-header">
                    <h2 id="upgrade-title">Minion Upgrades</h2>
                    <button id="close-upgrade-btn" class="close-btn">&times;</button>
                </div>
                <div id="upgrade-options" class="upgrade-grid">
                    <!-- Options generated by JS -->
                </div>
                <button id="sell-minion-btn" class="btn danger">Sell (50%)</button>
            </div>
            
            <div class="controls">
                <button id="start-wave-btn" class="btn primary">Start Wave</button>
                <button id="restart-btn" class="btn danger">Restart Game</button>
                <button id="code-btn" class="btn warning" style="margin-top: 10px;">Code</button>
            </div>
        </div>
        
        <div id="canvas-container">
            <canvas id="game-canvas" width="800" height="600"></canvas>
            <div id="game-over-overlay" class="overlay hidden">
                <h2 id="game-over-text">Game Over!</h2>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
